<style>
:root{--ink:#20252b;--line:#9aa3ad;--blue:#eaf2f8;--accent:#174f78}
*{box-sizing:border-box}
body{-webkit-text-size-adjust:100%;margin:0;background:#eef1f4;color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.45}
header{background:#173f5b;color:white;padding:18px 20px}
header h1{margin:0;font-size:22px} header p{margin:5px 0 0;font-size:13px;opacity:.9}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
button{border:0;border-radius:7px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#174f78;color:white;font-family:inherit}
button.secondary{background:#5c6873} button.danger{background:#a43b35} button.small{padding:6px 10px;font-size:12px}
.card{background:white;border:1px solid #d7dde2;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 7px #0000000a}
h2{font-size:17px;margin:0 0 12px;color:#173f5b;border-bottom:2px solid #dbe5ec;padding-bottom:8px}
h3{font-size:13px;margin:14px 0 7px;color:#173f5b}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field label{display:block;font-size:12px;font-weight:700;color:#47535e;margin-bottom:4px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;border:1px solid #bac4cc;border-radius:6px;padding:9px;font-size:14px;background:#fff;color:#20252b;font-family:inherit}
textarea{min-height:68px;resize:vertical}
.checkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check{display:flex;align-items:center;gap:7px;border:1px solid #dce2e7;border-radius:6px;padding:8px;font-size:13px}
input[type=checkbox]{width:17px;height:17px;flex:0 0 auto;accent-color:#174f78}
.check .mini{flex:1;min-width:70px;padding:5px 7px;font-size:13px}
.hint{font-size:12px;color:#64717b;margin:0 0 8px}
.wxbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}.wxbar .hint{margin:0}
.risk{border:1px solid #cbd4dc;border-radius:8px;margin:10px 0;overflow:hidden}
.riskhead{background:#edf3f7;padding:9px 11px;display:flex;gap:10px;align-items:center}
.riskhead strong{flex:1}
.riskbody{padding:11px}
.riskbody h4{font-size:12px;margin:0 0 6px;color:#47535e}
.riskbody .checkgrid{grid-template-columns:1fr;margin-bottom:8px}
footer{font-size:11px;color:#65717b;text-align:center;padding:12px}
.modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;flex-direction:column;align-items:center;padding:12px;overflow:auto}
.modal.show{display:flex}
.modal img{max-width:100%;background:#fff}
.modal p{color:#fff;font-size:14px;text-align:center}
.modal a,.modal button{margin:6px;padding:10px 16px;border-radius:7px;border:0;background:#1a73e8;color:#fff;font-weight:700;text-decoration:none;font-size:15px}
.curname{font-size:13px;color:#47535e;margin:-4px 0 12px;font-weight:700}
.modal.dlg{justify-content:center}
.dlgbox{background:#fff;color:#20252b;border-radius:10px;padding:16px;width:min(440px,100%);margin:auto}
.dlgbox h3{margin:0 0 10px;font-size:17px;color:#173f5b}
.modal .dlgbox p{color:#20252b;text-align:left;font-size:13px;margin:8px 0 4px;font-weight:700}
.modal .dlgbox p.hint2{font-weight:400;color:#64717b;font-size:12px}
.dlgbox input[type=text]{width:100%;border:1px solid #9aa3ad;border-radius:6px;padding:10px;font-size:16px;font-family:inherit}
.slist{max-height:45vh;overflow:auto;margin:8px 0;border:1px solid #dce2e7;border-radius:8px}
.srow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #eef1f4}
.srow:last-child{border-bottom:0}
.srow .nm{flex:1;min-width:0;word-break:break-all;font-size:14px;cursor:pointer}
.srow small{display:block;color:#64717b;font-size:11px}
.modal .srow button{margin:0;padding:7px 10px;font-size:12px}
.modal button.del{background:#a43b35}.modal button.gray{background:#5c6873}
.dbtn{display:flex;justify-content:flex-end;gap:4px;margin-top:6px}
.dbtn button{margin:0!important}
.dlgbox select{width:100%;font-size:16px;padding:10px;border:1px solid #9aa3ad;border-radius:6px;background:#fff;color:#20252b;font-family:inherit}
.modal button[disabled]{opacity:.4}
.wxlines{font-size:15px;line-height:1.7;margin:4px 0 8px}.wxlines small{color:#64717b;font-size:12px}
.wxgrade{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.6;border:1px solid #dce2e7;background:#f3f6f9}
.wxgrade b{font-size:15px}.wxgrade.g1{background:#eaf3ff;border-color:#b9d4fb}.wxgrade.g2{background:#eaf8ef;border-color:#b6e3c6}.wxgrade.g3{background:#fff8dc;border-color:#f0dd8a}.wxgrade.g4{background:#fff0e0;border-color:#f5c89a}.wxgrade.g5{background:#ffe9e7;border-color:#f3b5b0}.wxgrade.g0{background:#e8f0fb;border-color:#b5c9ea}
.wxres{border:1px solid #dce2e7;border-radius:8px;padding:2px 10px;margin:6px 0}
.wxres div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f4;font-size:15px}
.wxres div:last-child{border-bottom:0}
.wxres span{color:#64717b;flex:0 0 auto}.wxres b{text-align:right;word-break:keep-all}
.modal .dlgbox p.wxerr{color:#a43b35;font-weight:700}
details.kmakey{margin-top:10px;border:1px solid #dce2e7;border-radius:8px;padding:8px 10px}
details.kmakey summary{cursor:pointer;font-weight:700;font-size:13px;color:#173f5b}
details.kmakey input{margin-top:6px}
@media(max-width:720px){input,select,textarea{font-size:16px!important}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.checkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.grid,.grid2,.checkgrid{grid-template-columns:1fr}main{padding:0 8px}.card{padding:12px}}
</style>
<style id="sheetcss">
.sheet{width:794px;box-sizing:border-box;background:#fff;padding:12px 16px 10px;color:#111;font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:10.5px;line-height:1.3}
.sheet *{box-sizing:border-box}
.title{position:relative;height:50px;text-align:center}

.sheet .gap{margin-top:5px}
.ck{display:flex;align-items:flex-start;line-height:1.3;margin:1px 0}

.row{display:flex;flex-wrap:wrap;gap:1px 10px}
.bl{color:#1d5fc4}
.sm{font-size:7.5px;margin-left:2px;vertical-align:top}
.in{display:inline-block;min-width:44px;min-height:14px;font-weight:700;font-size:13px;color:#000}
.in.w{display:block;width:100%;min-height:22px;font-size:15px}
.in.ml{display:block;width:100%;min-height:34px;white-space:pre-wrap;font-size:13px}
.in.s{min-width:40px;font-size:10.5px}
.g3{display:grid;grid-template-columns:34% 33% 33%}
.nt{text-align:right;font-size:9px;margin:3px 0 1px;color:#222}
.ic{text-align:center;padding:2px}
.ic svg{display:block;margin:0 auto}
.foot{font-size:9.5px;margin-top:3px;color:#222}
</style>
</head>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const N=a=>a.map(x=>typeof x==='string'?{t:x}:x);
const plain=it=>it.t+(it.sm?' ('+it.sm+')':'')+(it.t2||'');

/* ---------- 항목 데이터 (종이 양식 기준) ---------- */
const WX=['맑음','강풍','비/눈','폭염','한파'];
const EQ=N(['크레인'].map(t=>({t,x:1})).concat(['스카이','시저형 고소작업대','사다리차','지게차','덤프트럭','굴착기','펌프카','믹서트럭'],[{t:'기타',x:1}]));
const SITE=N(['도로 가장 차선','도로 중앙 차선(사이 차선, 교차로 포함)','골목길/농로/비포장','실내(건물 안)','천정 내 작업','높은 층고(5m 이상)','건물(아파트) 내 지하 주차장','자재, 공구도구 낙하위험(시민재해)','도로변/터널/지하차도','전력선, 변압기 근접','특고압 방호관 설치 국소(미설치 작업중지)',{t:'기타',x:1}]);
const CM=N(['개인보호구 착용 및 주변 동료 보호구 착용 상태 확인','건설장비 안전장치 확인(고소차, 굴착기, 크레인 등)','팀원 건강상태 / 컨디션 확인','공도구 사용 전 점검','작업중지 기준 준수(폭염/한파/강풍/강우/강설)',{t:'작업장 유해 위험요인 확인',sm:'유해충 및 구조물(고정,균열 상태)'},'중량물 정보 및 취급에 관한 사항 확인']);
const HOT=N(['온습도계','얼음물','아이스박스','식염정','휴게시설(파라솔 등)',{t:'기타',x:1}]);
const COLD=N(['핫팩','발열조끼',{t:'기타',x:1}]);
const PLACE=N(['건물(옥상)','건물(옥탑)','전주','철탑','강관주','인빌딩(RF)',{t:'기타',x:1}]);
const RISKS=[
 {t:'떨어짐',sub:[],ic:'fall',c:N([{t:'전주 균열/전주 수직상태 확인',sm:'위험확인시 작업중지권 사용'},'수직사다리 고정 상태 확인 및 수직 생명줄 또는 안전블럭 설치','난간이 없는 옥상/옥탑/경사지붕 수평 생명줄 또는 안전블럭 설치','고소작업 시 안전고리 체결 및 경간 이동 시 이중 안전고리 교차 체결'])},
 {t:'떨어짐(이동식 사다리)',sub:N([{t:'사다리 상부 걸터서기(자세) 작업',bl:1}]),ic:'ladder',c:N(['사다리 상부 고정 및 아웃트리거 설치',{t:'사다리 안전작업 지침 준수',sm:'2인1조, 최상단 및 차상단 작업금지, 안전고리 체결'},{t:'사다리 작업중 가로질러 넘어가는 과정에서 안전대 체결',sm:'관리감독자에게 보고',bl:1}])},
 {t:'주행차량에 의한 교통사고',sub:[],ic:'car',c:N([{t:'안전시설물 설치 또는 차단 전문업체 활용',sm:'에어로봇, 안전표지판, 방호차량, 컬러콘'},'신호수 배치 및 신호체계 확인'])},
 {t:'건설장비에 부딪힘/끼임',sub:[],ic:'exca',c:N(['장비 유도자 배치 및 운전원과 신호체계 확인','작업반경 내 접근금지'])},
 {t:'넘어짐(인력/건설장비)',sub:[],ic:'crane',c:N(['이동통로 정리정돈, 결빙/물기 제거','작업 전 지반상태 확인','건설장비는 허용된 제원 내 운행','아웃트리거 수평인출 및 받침대 설치','작업차량 고임목 설치'])},
 {t:'감전',sub:[],ic:'elec',c:N([{t:'감전위험에 노출된 환경',sm:'전주,전원활동',t2:' 작업전 검전기로 누설전류 확인'},'특고압 3m 이상 이격 확인','노출형 변압기 펜스 내 접근 금지'])},
 {t:'낙하물 발생',sub:[],ic:'drop',c:N(['작업반경 내 또는 상부작업 시 직하단 접근금지(통제)','승인된 인양도구 사용(슬링벨트, 와이어, 샤클 등)','장비 설치 시 낙하물 방지망/삼각틀/도르래/안전블럭/체인블럭 등 설치','공구 이탈방지 끈줄 사용'])},
 {t:'화재, 폭발',sub:[],ic:'fire',c:N(['화기작업 주변 인화물 제거, 소화기 비치','불티 발생 작업 시 불티비산방지포 사용','작업 중 흡연 금지'])}
];

/* ---------- 입력 화면 (기존 방식) ---------- */
const FIELDS=[
 ['partner','협력사명','text'],['contractor','도급사명','text','SKO 충청 Acc.'],['date','작성일자','date'],['project','국소명','text'],
 ['worktype','작업공종','text'],['workers','투입 인원','text','','예: 홍길동, 김철수'],['weather','기상상황','select'],['feel','체감온도 (℃)','number'],
 ['air','기온 (℃)','number'],['signal','신호수','text'],['guide','유도자','text'],['partnerTel','협력사 비상연락망','text'],
 ['mgrTel','도급사 관리감독자 비상연락망','text','이정훈(010-5459-3793)']
];
const fieldHTML=([id,label,type,def,ph])=>{
 const inp=type==='select'?`<select data-f="${id}"><option value="">선택</option>${WX.map(w=>`<option>${w}</option>`).join('')}</select>`
  :`<input type="${type}" data-f="${id}" ${def?`data-def="${esc(def)}"`:''} ${ph?`placeholder="${esc(ph)}"`:''} ${type==='number'?'step="0.1"':''}>`;
 return `<div class="field"><label>${label}</label>${inp}</div>`;
};
const chkHTML=(g,items)=>items.map((it,i)=>`<label class="check"><input type="checkbox" data-k="${g}:${i}"><span>${esc(plain(it))}</span>${it.x?`<input type="text" class="mini" data-x="${g}:${i}" placeholder="내용 입력">`:''}</label>`).join('');
const riskHTML=(r,i)=>`<div class="risk"><div class="riskhead"><input type="checkbox" data-k="r${i}:h" aria-label="위험요인 선택"><strong>${esc(r.t)}</strong></div><div class="riskbody">${r.sub.length?`<h4>위험요인 / 확인사항</h4><div class="checkgrid">${r.sub.map((s,j)=>`<label class="check"><input type="checkbox" data-k="r${i}:s${j}"><span>${esc(plain(s))}</span></label>`).join('')}</div>`:''}<h4>안전대책</h4><div class="checkgrid">${r.c.map((c,j)=>`<label class="check"><input type="checkbox" data-k="r${i}:c${j}"><span>${esc(plain(c))}</span></label>`).join('')}</div></div></div>`;

const REGIONS=[
['특별시·광역시·세종',[['서울',37.57,126.98],['부산',35.18,129.08],['대구',35.87,128.60],['인천',37.46,126.71],['광주',35.16,126.85],['대전',36.35,127.38],['울산',35.54,129.31],['세종',36.48,127.29]]],

// 텍스트를 입력하면 해당 체크가 자동으로 켜짐
$$('[data-x]').forEach(t=>t.addEventListener('input',()=>{const c=$(`[data-k="${t.dataset.x}"]`);if(c&&t.value.trim())c.checked=true}));

/* ---------- 상태 수집 / 적용 ---------- */
function collect(){
 const f={},c={},x={};
 $$('[data-f]').forEach(e=>f[e.dataset.f]=e.value);
 $$('[data-k]').forEach(e=>c[e.dataset.k]=e.checked);
 $$('[data-x]').forEach(e=>x[e.dataset.x]=e.value);
 return {f,c,x};
}
function apply(d){
 if(!d)return;
 $$('[data-f]').forEach(e=>{if(d.f&&d.f[e.dataset.f]!==undefined)e.value=d.f[e.dataset.f]});
 $$('[data-k]').forEach(e=>e.checked=!!(d.c&&d.c[e.dataset.k]));
 $$('[data-x]').forEach(e=>e.value=(d.x&&d.x[e.dataset.x])||'');
}
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
function defaults(){
 $$('[data-f]').forEach(e=>e.value=e.dataset.def||'');
 $$('[data-k]').forEach(e=>e.checked=false);
 $$('[data-x]').forEach(e=>e.value='');
 $('[data-f=date]').value=today();
}
defaults();
function resetForm(){if(!confirm('현재 입력 내용을 지우고 새 평가표를 시작할까요?'))return;defaults();clearManual();setDate();curName='';showName();autoWeather(true);scrollTo(0,0)}

/* 화면 요소를 직접 캔버스에 그림 (iPhone Safari에서도 동작하도록 foreignObject를 쓰지 않음) */
async function paintSheet(sheet,W,H,CW,CH){
 const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;
 const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,CW,CH);
 const r=Math.min(CW/W,CH/H);x.save();x.scale(r,r);
 const o=sheet.getBoundingClientRect(),ox=o.left,oy=o.top;
 const inSvg=e=>e.tagName.toLowerCase()!=='svg'&&!!e.closest('svg');
 const els=[sheet,...sheet.querySelectorAll('*')].filter(e=>!inSvg(e)&&e.tagName!=='STYLE');
 for(const e of els){
  const bg=getComputedStyle(e).backgroundColor;
  if(bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'){const b=e.getBoundingClientRect();x.fillStyle=bg;x.fillRect(b.left-ox,b.top-oy,b.width,b.height)}
 }
 for(const e of els){
  const cs=getComputedStyle(e),b=e.getBoundingClientRect(),cell=e.tagName==='TD'||e.tagName==='TH';
  for(const S of ['Top','Right','Bottom','Left']){
   const w=parseFloat(cs['border'+S+'Width']),st=cs['border'+S+'Style'];
   if(!(w>0)||st==='none'||st==='hidden')continue;
   const h=cell?0:w/2;let X1,Y1,X2,Y2;
   if(S==='Top'){X1=b.left;X2=b.right;Y1=Y2=b.top+h}
   else if(S==='Bottom'){X1=b.left;X2=b.right;Y1=Y2=b.bottom-h}
   else if(S==='Left'){Y1=b.top;Y2=b.bottom;X1=X2=b.left+h}
   else{Y1=b.top;Y2=b.bottom;X1=X2=b.right-h}
   x.strokeStyle=cs['border'+S+'Color'];x.lineWidth=w;x.lineCap='butt';x.beginPath();x.moveTo(X1-ox,Y1-oy);x.lineTo(X2-ox,Y2-oy);x.stroke();
  }
 }
 $$('.cb.on',sheet).forEach(c=>{
  const b=c.getBoundingClientRect(),bx=b.left-ox,by=b.top-oy;
  x.strokeStyle='#000';x.lineWidth=2.3;x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.moveTo(bx+1.2,by+5);x.lineTo(bx+4,by+8.3);x.lineTo(bx+10.5,by-3);x.stroke();
 });
 await Promise.all($$('svg',sheet).filter(s=>!s.parentElement.closest('svg')).map(sv=>new Promise(res=>{
  const b=sv.getBoundingClientRect(),im=new Image();
  im.onload=()=>{x.drawImage(im,b.left-ox,b.top-oy,b.width,b.height);res()};im.onerror=()=>res();
  im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(sv));
 })));
 const tw=document.createTreeWalker(sheet,NodeFilter.SHOW_TEXT);
 let n;
 while((n=tw.nextNode())){
  const t=n.nodeValue,p=n.parentElement;
  if(!t.trim()||inSvg(p)||p.closest('svg')||p.tagName==='STYLE')continue;
  const cs=getComputedStyle(p),fs=parseFloat(cs.fontSize);
  x.font=cs.fontStyle+' '+cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
  x.fillStyle=cs.color;x.textBaseline='middle';
  const ul=(cs.textDecorationLine||'').indexOf('underline')>=0;
  const rg=document.createRange();let line='',lx=0,ly=0,lt=null;
  const flush=()=>{
   if(line.trim()){
    x.fillText(line,lx-ox,ly-oy);
    if(ul){const wd=x.measureText(line).width;x.fillRect(lx-ox,ly-oy+fs*0.47,wd,Math.max(1,fs/16))}
   }
   line='';
  };
  for(let i=0;i<t.length;i++){
   rg.setStart(n,i);rg.setEnd(n,i+1);
   const rc=rg.getClientRects()[0];
   if(!rc||(rc.width===0&&rc.height===0))continue;
   if(lt===null||Math.abs(rc.top-lt)>2){flush();lt=rc.top;lx=rc.left;ly=rc.top+rc.height/2}
   line+=t[i];
  }
  flush();
 }
 x.restore();
 return cv;
}

 catch(e){return false}
}

}

const revCache={};
async function reverseName(lat,lon){
 const k=lat.toFixed(3)+','+lon.toFixed(3);
 if(revCache[k])return revCache[k];

function toGrid(lat,lon){
 const RE=6371.00877,GRID=5.0,SLAT1=30.0,SLAT2=60.0,OLON=126.0,OLAT=38.0,XO=43,YO=136,D=Math.PI/180;
 const re=RE/GRID,s1=SLAT1*D,s2=SLAT2*D,ol=OLON*D,oa=OLAT*D;
 let sn=Math.tan(Math.PI*0.25+s2*0.5)/Math.tan(Math.PI*0.25+s1*0.5);
 sn=Math.log(Math.cos(s1)/Math.cos(s2))/Math.log(sn);
 let sf=Math.tan(Math.PI*0.25+s1*0.5);sf=Math.pow(sf,sn)*Math.cos(s1)/sn;
 let ro=Math.tan(Math.PI*0.25+oa*0.5);ro=re*sf/Math.pow(ro,sn);
 let ra=Math.tan(Math.PI*0.25+lat*D*0.5);ra=re*sf/Math.pow(ra,sn);
 let th=lon*D-ol;if(th>Math.PI)th-=2*Math.PI;if(th<-Math.PI)th+=2*Math.PI;th*=sn;
 return {x:Math.floor(ra*Math.sin(th)+XO+0.5),y:Math.floor(ro-ra*Math.cos(th)+YO+0.5)};
}

function kmaBase(nowMs,back){

 wxPop('<div class="wxlines"><div>☀️ <b>날씨 정보 연동 결과</b> <small>('+esc(r.source||'')+')</small></div><div>📍 현재 위치: '+esc(r.place)+'</div><div>🌡️ 실제 기온: '+r.air+'℃ | 체감 온도: '+r.feel+'℃</div>'+(r.rh!=null?'<div>💧 현재 습도: '+Math.round(r.rh)+'%</div>':'')+'<div>🌤️ 기상상황: '+esc(r.weather)+'</div><div>🕒 기준 시각: '+esc(r.time)+'</div></div><div class="wxgrade '+g.c+'"><b>'+g.e+' ['+g.n+']</b> '+esc(g.m[0])+g.m.slice(1).map(x=>'<br>'+esc(x)).join('')+'</div>'+(r.note?'<p class="wxerr">'+esc(r.note)+'</p>':'')+'<p class="hint2">확인을 누르면 기상상황·체감온도·기온만 바뀌고, 다른 내용은 그대로 유지됩니다.</p>',true);
}
$('#dlg').addEventListener('change',e=>{
 if(e.target.id!=='wxPopRegion')return;
 const m=$('#wxRegion');m.value=e.target.value;
 try{localStorage.setItem('riskRegion',m.value)}catch(_){}
 showWxPopup();
});
$('#wxBtn').addEventListener('click',showWxPopup);
function dayCheck(){
 const t=today();
 if(t!==lastDay){lastDay=t;setDate();autoWeather(false)}
 else if(!document.hidden&&!wxBusy&&Date.now()-lastFetch>300000)autoWeather(false);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
addEventListener('focus',dayCheck);
setInterval(dayCheck,60000);
try{localStorage.removeItem('riskLoc')}catch(e){}
function restoreRegion(){
 const sel=$('#wxRegion');
 try{const v=localStorage.getItem('riskRegion');if(v&&[...sel.options].some(op=>op.value===v))sel.value=v}catch(e){}
}
if(!/^https?:$/.test(location.protocol)){restoreRegion();if($('#wxRegion').value)showFb()}
$('#wxRegion').addEventListener('change',e=>{try{localStorage.setItem('riskRegion',e.target.value)}catch(_){}showWxPopup()});
setDate();

/* ---------- 저장 / 다른 이름으로 저장 / 불러오기 ---------- */
let curName='';
function showName(){const e=$('#curName');if(e)e.textContent=curName?('현재 저장명: '+curName):'현재 저장명: (아직 저장 안 됨)'}
function getSaves(){
 try{
  let s=JSON.parse(localStorage.getItem('riskSaves')||'null');
  if(!Array.isArray(s)){
   s=[];
   const old=localStorage.getItem('riskForm3');
   if(old){s.push({n:'이전 저장본',d:JSON.parse(old),t:Date.now()});localStorage.setItem('riskSaves',JSON.stringify(s))}
  }
  return s;
 }catch(e){return[]}
}
function putSaves(s){try{localStorage.setItem('riskSaves',JSON.stringify(s));return true}catch(e){alert('저장하지 못했습니다. 저장 공간을 확인해 주세요.');return false}}
function openDlg(title,html){$('#dlgT').textContent=title;$('#dlgB').innerHTML=html;$('#dlg').classList.add('show')}
function closeDlg(){wxTok++;$('#dlg').classList.remove('show')}
function fmtT(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes())}
function doSave(name){
 name=String(name||'').trim().slice(0,40);
 if(!name){alert('저장명을 입력해 주세요.');return false}
 const s=getSaves(),i=s.findIndex(x=>x.n===name);
 if(i>=0&&name!==curName&&!confirm('"'+name+'" 이름이 이미 있습니다. 덮어쓸까요?'))return false;
 const rec={n:name,d:collect(),t:Date.now()};
 if(i>=0)s[i]=rec;else s.push(rec);
 if(!putSaves(s))return false;
 curName=name;showName();return true;
}
function saveForm(){
 if(!curName){saveAs();return}
 if(doSave(curName))wxStat('저장했습니다: '+curName);
}
function saveAs(){
 const s=getSaves().slice().sort((a,b)=>b.t-a.t);
 const proj=($('[data-f=project]').value||'위험성평가').trim();
 const def=curName||(proj+'_'+($('[data-f=date]').value||today()));
 const list=s.length?'<p>기존 저장명 (누르면 이름이 입력됩니다)</p><div class="slist">'+s.map(x=>'<div class="srow"><div class="nm" data-a="pick" data-n="'+esc(x.n)+'">'+esc(x.n)+'<small>'+fmtT(x.t)+' 저장</small></div></div>').join('')+'</div>':'';
 openDlg('다른 이름으로 저장','<p>저장명</p><input type="text" id="saveName" maxlength="40" value="'+esc(def)+'">'+list+'<div class="dbtn"><button type="button" data-a="dosave">저장</button><button type="button" class="gray" data-a="close">취소</button></div>');
 const inp=$('#saveName');inp.focus();inp.select();
}
function loadForm(){
 const s=getSaves().slice().sort((a,b)=>b.t-a.t);
 const body=s.length?'<div class="slist">'+s.map(x=>'<div class="srow"><div class="nm" data-a="load" data-n="'+esc(x.n)+'">'+esc(x.n)+(x.n===curName?' (현재)':'')+'<small>'+fmtT(x.t)+' 저장</small></div><button type="button" data-a="load" data-n="'+esc(x.n)+'">불러오기</button><button type="button" class="del" data-a="del" data-n="'+esc(x.n)+'">삭제</button></div>').join('')+'</div>':'<p>저장된 내용이 없습니다.</p>';
 openDlg('저장 내용 불러오기',body+'<p class="hint2">불러오면 작성일자와 날씨는 오늘 기준으로 자동 갱신됩니다.</p><div class="dbtn"><button type="button" class="gray" data-a="close">닫기</button></div>');
}
function loadByName(n){
 const x=getSaves().find(v=>v.n===n);if(!x){alert('저장본을 찾을 수 없습니다.');return}
 apply(x.d);
 ['weather','feel','air'].forEach(k=>{$('[data-f='+k+']').value=''});
 clearManual();setDate();autoWeather(true);
 curName=n;showName();closeDlg();scrollTo(0,0);
}
$('#dlg').addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');
 if(!t){if(e.target.id==='dlg')closeDlg();return}
 const a=t.dataset.a,n=t.dataset.n;
 if(a==='close')closeDlg();
 else if(a==='pick'){const i=$('#saveName');i.value=n;i.focus()}
 else if(a==='dosave'){if(doSave($('#saveName').value)){closeDlg();wxStat('저장했습니다: '+curName)}}
 else if(a==='load')loadByName(n);
 else if(a==='wxok'){if(wxData){fillWx(wxData,true);closeDlg()}}
 else if(a==='wxretry'){showWxPopup()}
 else if(a==='del'){
  if(!confirm('"'+n+'" 저장본을 삭제할까요?'))return;
  putSaves(getSaves().filter(v=>v.n!==n));
  if(n===curName){curName='';showName()}
  loadForm();
 }
});
$('#dlg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='saveName'){e.preventDefault();if(doSave(e.target.value)){closeDlg();wxStat('저장했습니다: '+curName)}}});
showName();
